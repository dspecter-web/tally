const dayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

const DIAG = [];
const log = (level, msg, data) => {
  DIAG.push({ time: new Date().toISOString(), level, msg, data }); if (DIAG.length > 100) DIAG.shift();
  try { (console[level] || console.log)('[Tally]', msg, data === undefined ? '' : data); } catch {}
};
window.tallyLog = () => DIAG;   // type tallyLog() in the browser console to see recent events
window.addEventListener('error', e => log('error', 'uncaught error', { message: e.message, at: `${e.filename}:${e.lineno}` }));
window.addEventListener('unhandledrejection', e => log('error', 'unhandled promise rejection', { reason: String((e.reason && e.reason.message) || e.reason) }));

function useStore(key, init, validate) {
  const [v, setV] = useState(() => {
    try { const s = localStorage.getItem(key); if (s === null) return init; const parsed = JSON.parse(s); return validate ? validate(parsed, init) : parsed; }
    catch (e) { log('warn', `could not read "${key}", using defaults`, String(e)); return init; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { log('warn', `could not save "${key}"`, String(e)); } }, [key, v]);
  return [v, setV];
}

function useMedia(q) {
  const [m, setM] = useState(() => matchMedia(q).matches);
  useEffect(() => { const l = matchMedia(q), f = () => setM(l.matches); f(); l.addEventListener('change', f); return () => l.removeEventListener('change', f); }, [q]);
  return m;
}

function useCount(target, ms = 1000) {
  const [v, setV] = useState(0); const from = useRef(0);
  useEffect(() => {
    const s = from.current, t0 = performance.now(); let r;
    const step = t => { const p = Math.min(1, (t - t0) / ms), n = Math.round(s + (target - s) * (1 - Math.pow(1 - p, 3))); from.current = n; setV(n); if (p < 1) r = requestAnimationFrame(step); };
    r = requestAnimationFrame(step); return () => cancelAnimationFrame(r);
  }, [target]);
  return v;
}

const shrink = (src, max = 1024, q = .8) => {
  const w = src.videoWidth || src.width, h = src.videoHeight || src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
};

const t = (k, v) => {
  let out = (I18N[LANG] && I18N[LANG][k]) ?? I18N.en[k] ?? k;
  if (v) for (const x in v) out = out.split('{' + x + '}').join(v[x]);
  return out;
};

const API = 'https://generativelanguage.googleapis.com/v1beta';
const FALLBACK_MODELS = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-2.5-flash'];
const TIMEOUT_MS = 30000;

class GeminiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }

function explain(status, msg, model) {
  const m = msg || '';
  if (status === 429 || /quota|rate limit|RESOURCE_EXHAUSTED/i.test(m)) return t('e_quota');
  if (status === 401 || /API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return t('e_key');
  if (/location is not supported/i.test(m)) return t('e_region');
  if (status === 403) return t('e_403', { d: m });
  if (status === 404) return t('e_404', { model });
  if (status >= 500) return t('e_5xx', { code: status });
  return t('e_other', { code: status, d: m || t('e_unknown') });
}

const ROOT = 'https://generativelanguage.googleapis.com/';
const probe = async url => { try { await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(8000) }); return true; } catch { return false; } };

async function diagnose() {
  if (navigator.onLine === false) return t('d_offline');
  if (window !== window.top) return t('d_frame');
  const [api, google] = await Promise.all([probe(ROOT), probe('https://www.google.com/generate_204')]);
  if (!api && google) return t('d_blocked');
  if (!api) return t('d_nogoogle');
  return t('d_cors');
}

async function callGemini(key, model, body, viaUrl = false) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const url = `${API}/models/${encodeURIComponent(model)}:generateContent` + (viaUrl ? `?key=${encodeURIComponent(key)}` : '');
    const res = await fetch(url, {
      method: 'POST', signal: ctl.signal, body: JSON.stringify(body),
      headers: { 'Content-Type': 'application/json', ...(viaUrl ? {} : { 'x-goog-api-key': key }) }
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new GeminiError(explain(res.status, j.error?.message, model), res.status);
    return j;
  } catch (e) {
    if (e instanceof GeminiError) throw e;
    if (e.name === 'AbortError') throw new GeminiError(t('e_timeout', { s: TIMEOUT_MS / 1000 }), 'timeout');
    if (!viaUrl && await probe(ROOT)) return callGemini(key, model, body, true);   // reachable but blocked: retry without the custom header
    throw new GeminiError(await diagnose(), 'network');
  } finally { clearTimeout(timer); }
}

function parseReply(j) {
  if (j.promptFeedback?.blockReason) throw new GeminiError(t('e_blocked', { reason: j.promptFeedback.blockReason }));
  const c = j.candidates?.[0];
  const out = (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if (!out) throw new GeminiError(c?.finishReason && c.finishReason !== 'STOP' ? t('e_noanswer', { reason: c.finishReason }) : t('e_empty'));
  let r; try { const m = out.match(/\{[\s\S]*\}/); r = JSON.parse(m ? m[0] : out); } catch { throw new GeminiError(t('e_format')); }
  const num = v => Math.max(0, Math.round(parseFloat(v) || 0)), calories = num(r.calories);
  if (!calories) throw new GeminiError(t('e_nocal'));
  return { name: String(r.name || '').trim(), note: String(r.portion || '').trim(), calories, protein: num(r.protein), carbs: num(r.carbs), fat: num(r.fat) };
}

const checkKey = k => {
  const key = (k || '').trim().replace(/^["']|["']$/g, '');
  if (!key) throw new GeminiError(t('e_nokey'));
  if (!/^[\x21-\x7E]+$/.test(key)) throw new GeminiError(t('e_keychars'));
  return key;
};

// Quick, simple GET: proves the key works and shows which models this key can really use.
async function listModels(key) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const res = await fetch(`${API}/models?pageSize=200&key=${encodeURIComponent(key)}`, { signal: ctl.signal });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new GeminiError(explain(res.status, j.error?.message, ''), res.status);
    return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', ''));
  } catch (e) {
    if (e instanceof GeminiError) throw e;
    if (e.name === 'AbortError') throw new GeminiError(t('e_list_timeout'), 'timeout');
    throw new GeminiError(await diagnose(), 'network');
  } finally { clearTimeout(timer); }
}

// Newest stable Flash models first, then Flash-Lite.
const pickModels = names => {
  const v = n => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)-flash$/); return m ? parseFloat(m[1]) : -1; };
  return [...names.filter(n => v(n) >= 0).sort((a, b) => v(b) - v(a)), ...names.filter(n => /^gemini-[\d.]+-flash-lite$/.test(n))];
};

async function analyze({ key, model, models, text, image, onModel }) {
  key = checkKey(key);
  const L = LANG_NAME[LANG];
  const prompt = `You are a nutrition expert for users in Turkey, Germany and English-speaking countries. The user's interface language is ${L}.` +
    (text ? ` The user typed this food or meal: "${text}". It may be written in Turkish, English or German (or a mix), with special characters (ç ğ ı İ ö ş ü ä ß), missing diacritics (for example "cig kofte", "Spatzle", "mercimek corbasi"), typos, or regional dish names. Work out which dish is meant.` : '') +
    (image ? ` ${text ? 'Also use' : 'Use'} the attached photo: identify every food and drink visible, including Turkish dishes (menemen, lahmacun, iskender, simit, börek, mantı), German dishes (Schnitzel, Currywurst, Käsespätzle, Brezel, Maultaschen) and international food.` : '') +
    ` Estimate the nutrition of the whole portion. Reply only with JSON: {"name": the dish name written in ${L} (if the dish has a well-known original name in another language, add it in parentheses), "portion": one short sentence in ${L} naming the main ingredients and the portion you assumed, "calories": number, "protein": grams, "carbs": grams, "fat": grams}. Write every text value in ${L}, and use whole numbers for the numeric values.`;
  const parts = [{ text: prompt }];
  if (image) parts.push({ inline_data: { mime_type: 'image/jpeg', data: image.split(',')[1] } });
  // Turn long "thinking" down: it is the main cause of slow answers on Flash models.
  const think = m => /^gemini-2\.5-flash/.test(m) ? { thinkingBudget: 0 } : /^gemini-3/.test(m) ? { thinkingLevel: 'minimal' } : null;
  const bodyFor = (m, t = true) => ({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2, ...(t && think(m) ? { thinkingConfig: think(m) } : {}) } });
  const attempt = async m => {
    try { return await callGemini(key, m, bodyFor(m)); }
    catch (e) { if (e.status === 400 && /think/i.test(e.message)) return callGemini(key, m, bodyFor(m, false)); throw e; }
  };
  const list = [...new Set((models || [model, ...FALLBACK_MODELS]).filter(Boolean))], tried = [];
  let best;
  for (const mdl of list) {
    tried.push(mdl);
    try {
      const result = parseReply(await attempt(mdl));
      if (onModel && mdl !== model) onModel(mdl);
      return { ...result, model: mdl };
    } catch (e) {
      if (!best || best.status === 404) best = e;
      if (!(e.status === 404 || e.status === 429 || e.status === 'timeout' || e.status >= 500)) throw e;   // only model-specific failures try the next model
    }
  }
  if (tried.length > 1) best.message += t('e_tried', { models: tried.join(', ') });
  throw best;
}

function Ring({ value, goal }) {

          strokeDasharray={C} strokeDashoffset={C * (1 - pct)} style={{ filter: 'drop-shadow(0 0 8px rgba(255,255,255,.5))', transition: 'stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)' }} />

}

const DEFAULT_WORKOUT = [['Barbell squat', '4 × 6'], ['Bench press', '4 × 8'], ['Bent-over row', '3 × 10'], ['Overhead press', '3 × 8'], ['Plank', '3 × 45 s']].map(([name, detail]) => ({ id: uid(), name, detail, doneOn: null }));

// Repairs saved workout data so damaged or old entries can never crash the tab.
function sanitizeWorkout(v, fallback) {
  if (!Array.isArray(v)) { log('warn', 'saved workout data was not a list; reset to defaults'); return fallback; }
  const seen = new Set();
  const out = v.filter(i => i && typeof i === 'object' && String(i.name ?? '').trim()).map(i => {
    let id = typeof i.id === 'string' && i.id ? i.id : uid(); while (seen.has(id)) id = uid(); seen.add(id);
    return { id, name: String(i.name).trim(), detail: String(i.detail ?? '').trim(), doneOn: typeof i.doneOn === 'string' ? i.doneOn : null };
  });
  if (out.length !== v.length) log('warn', 'repaired damaged workout entries', { kept: out.length, total: v.length });
  return out;
}

const TAB_TINT = { nutrition: 'bg-amber-100 text-amber-600', workouts: 'bg-emerald-100 text-emerald-600', settings: 'bg-sky-100 text-sky-600' };

function LangMenu({ value, onChange }) {
  const [open, setOpen] = useState(false), box = useRef();
  const cur = LANGS.find(l => l[0] === value) || LANGS[1];
  useEffect(() => {
    if (!open) return;
    const away = e => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    const esc = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', away); document.addEventListener('touchstart', away); document.addEventListener('keydown', esc);
    const f = requestAnimationFrame(() => { const b = box.current && box.current.querySelector('[aria-selected="true"] button'); if (b) b.focus(); });
    return () => { cancelAnimationFrame(f); document.removeEventListener('mousedown', away); document.removeEventListener('touchstart', away); document.removeEventListener('keydown', esc); };
  }, [open]);
  const pick = k => { onChange(k); setOpen(false); };
  const arrows = e => {
    const b = [...e.currentTarget.querySelectorAll('button')], i = b.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); b[(i + 1) % b.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); b[(i - 1 + b.length) % b.length].focus(); }
  };
  return (
    <div ref={box} className="relative">
      <button type="button" aria-haspopup="listbox" aria-expanded={open} aria-label={`${t('lang_label')}: ${cur[1]}`} onClick={() => setOpen(o => !o)}
        className={`h-11 pl-1.5 pr-3.5 flex items-center gap-2.5 rounded-full bg-white/85 backdrop-blur border transition-all duration-300 ${open ? 'border-cobalt/40 shadow-[0_14px_30px_-12px_rgba(91,77,245,.55)]' : 'border-white shadow-[0_8px_22px_-12px_rgba(79,70,229,.45)] hover:shadow-[0_12px_28px_-12px_rgba(79,70,229,.6)] hover:-translate-y-px'}`}>

        <span className="text-sm font-semibold">{cur[1]}</span>
        <span className={`text-ink/50 transition-transform duration-300 ${open ? 'rotate-180' : ''}`}><Icon n="chevron" s={16} /></span>

        className={`absolute right-0 top-full mt-2 w-56 p-1.5 rounded-2xl bg-white/95 backdrop-blur-xl border border-white shadow-[0_28px_60px_-20px_rgba(79,70,229,.5)] origin-top-right transition-[opacity,transform,visibility] duration-200 ease-out ${open ? 'opacity-100 scale-100 translate-y-0 visible' : 'opacity-0 scale-95 -translate-y-1 invisible pointer-events-none'}`}>
        <li role="presentation" className="px-2.5 pt-1.5 pb-1 text-xs font-medium text-ink/45 flex items-center gap-1.5"><Icon n="globe" s={13} />{t('lang_label')}</li>
        {LANGS.map(([k, l]) => (
          <li key={k} role="option" aria-selected={k === value}>
            <button type="button" tabIndex={open ? 0 : -1} onClick={() => pick(k)}
              className={`w-full flex items-center gap-3 px-2.5 py-2 rounded-xl text-sm text-left transition-colors duration-200 ${k === value ? 'bg-gradient-to-r from-indigo-50 to-fuchsia-50 font-semibold' : 'hover:bg-slate-100/80'}`}>
              <span className={`w-8 h-8 rounded-full grid place-items-center text-[11px] font-bold tracking-wide shrink-0 ${k === value ? 'text-white bg-gradient-to-br from-cobalt via-violet-500 to-fuchsia-500' : 'text-ink/60 bg-slate-100'}`}>{k.toUpperCase()}</span>
              <span className="flex-1">{l}</span>
              {k === value && <span className="text-cobalt"><Icon n="check" s={18} /></span>}
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null, copied: false }; this.copy = this.copy.bind(this); }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) {
    log('error', `the ${this.props.tab} tab crashed`, { message: String((err && err.message) || err), stack: String((err && err.stack) || '').split('\n').slice(0, 4), where: String((info && info.componentStack) || '').split('\n').slice(0, 4) });
  }
  copy() {
    const text = JSON.stringify(DIAG, null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => this.setState({ copied: true }), () => window.prompt('Copy:', text));
  }
  render() {
    const { err, copied } = this.state;
    if (!err) return this.props.children;
    return (
      <div role="alert" className="card p-6 max-w-xl">
        <h2 className="font-display text-3xl">{t('crash_title')}</h2>
        <p className="mt-2 text-ink/60 text-sm">{t('crash_body')}</p>
        <p className="mt-3 text-sm rounded-xl bg-red-50 text-red-700 px-3 py-2 font-mono">{String(err.message || err)}</p>
        <div className="mt-4 flex flex-wrap gap-2">
          <button onClick={() => this.setState({ err: null })} className="btn h-10 px-5 text-sm">{t('crash_retry')}</button>
          {this.props.onReset && <button onClick={() => { this.props.onReset(); this.setState({ err: null }); }} className="h-10 px-5 rounded-full bg-fog text-sm font-medium">{t('crash_reset')}</button>}
          <button onClick={this.copy} className="h-10 px-5 rounded-full bg-fog text-sm font-medium">{copied ? t('crash_copied') : t('crash_copy')}</button>
        </div>
      </div>
    );
  }
}

    <Boundary key={tab} tab={tab} onReset={tab === 'workouts' ? resetWorkout : null}>
      <div className="fade min-w-0">
        {tab === 'nutrition' && <Nutrition meals={meals} setMeals={setMeals} settings={settings} goSettings={() => setTab('settings')} setModel={m => setSettings(x => ({ ...x, model: m }))} compact={compact} two={!compact && wide} />}
        {tab === 'workouts' && <Workouts items={workout} setItems={setWorkout} compact={compact} />}
        {tab === 'settings' && <Settings settings={settings} setSettings={setSettings} compact={compact} />}
      </div>
    </Boundary>
  );

  return (
    <div className="h-full flex flex-col overflow-hidden">
      <div className={`shrink-0 h-14 flex items-center px-4 ${compact ? 'justify-center' : 'justify-end pr-10'}`}>
        <Segmented value={mode} onChange={setMode} options={MODES.map(k => [k, t('view_' + k)])} label={t('view_label')} className="w-full max-w-[330px]" />
      </div>
      {compact ? (
        <div className="flex-1 min-h-0 flex justify-center min-[520px]:px-4 min-[520px]:pb-4">
          <div className="relative w-full max-w-[430px] h-full flex flex-col bg-[#F3F2FF]/85 overflow-hidden min-[520px]:rounded-[40px] min-[520px]:border-[8px] min-[520px]:border-ink min-[520px]:shadow-[0_40px_80px_-30px_rgba(15,20,25,.45)]">
            <main ref={scroller} className="scroll flex-1 min-h-0 px-4 pt-5 pb-6">{header}{view}</main>
            <nav className="relative shrink-0 grid grid-cols-3 bg-white/85 backdrop-blur-xl border-t border-white pb-[env(safe-area-inset-bottom)]">
              <div className="absolute top-0 left-0 w-1/3 flex justify-center" style={{ transform: `translateX(${idx * 100}%)`, transition: 'transform .45s cubic-bezier(.22,1,.36,1)' }}><div className="w-9 h-[3px] rounded-b-full bg-gradient-to-r from-cobalt to-fuchsia-500" /></div>
              {tabs.map(([k, l]) => (
                <button key={k} onClick={() => setTab(k)} className={`min-w-0 py-2.5 flex flex-col items-center gap-1 text-xs font-medium transition-colors duration-300 ${tab === k ? 'text-cobalt' : 'text-ink/50'}`}><Icon n={k} />{l}</button>
              ))}
            </nav>
          </div>
        </div>
      ) : (
        <div className="flex-1 min-h-0 flex">
          <aside className="w-64 shrink-0 pl-4 pb-4">
            <div className="card h-full p-4 flex flex-col">
              <div className="flex items-center gap-3 px-2 pt-1 mb-8">
                <span className="w-10 h-10 rounded-2xl grid place-items-center text-white bg-gradient-to-br from-cobalt via-violet-500 to-fuchsia-500 shadow-[0_10px_22px_-8px_rgba(91,77,245,.8)]"><Icon n="logo" s={22} /></span>
                <span className="font-display text-4xl leading-none">Tally</span>
              </div>
              <nav className="relative flex flex-col gap-1">
                <div className="absolute inset-x-0 top-0 h-12 rounded-2xl bg-gradient-to-r from-cobalt to-violet-500 shadow-[0_12px_24px_-10px_rgba(91,77,245,.75)]" style={{ transform: `translateY(${idx * 52}px)`, transition: 'transform .5s cubic-bezier(.22,1,.36,1)' }} />
                {tabs.map(([k, l]) => (
                  <button key={k} onClick={() => setTab(k)} className={`relative z-10 h-12 pl-2 pr-4 flex items-center gap-3 rounded-2xl text-[15px] font-medium transition-colors duration-300 ${tab === k ? 'text-white' : 'text-ink/65 hover:text-ink'}`}>
                    <span className={`w-8 h-8 rounded-xl grid place-items-center transition-colors duration-300 ${tab === k ? 'bg-white/20 text-white' : TAB_TINT[k]}`}><Icon n={k} s={18} /></span>{l}
                  </button>
                ))}
              </nav>
              <div className={`mt-auto rounded-2xl px-3 py-2.5 text-sm font-medium flex items-center gap-2 ${settings.key ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-ink/55'}`}>
                <span className={`w-2 h-2 rounded-full ${settings.key ? 'bg-emerald-500 animate-pulse' : 'bg-ink/25'}`} />{settings.key ? t('gemini_on') : t('gemini_off')}
              </div>
            </div>
          </aside>
          <main ref={scroller} className="scroll flex-1 min-w-0 px-10 pt-2 pb-10"><div className="max-w-[1200px]">{header}{view}</div></main>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
